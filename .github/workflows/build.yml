name: MSBuild

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'

env:
  SOLUTION_FILE_PATH: CP_Main_10.sln

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Set the value
        run: |
            echo "VERSION_FILENAME=3_25_${env:BUILD_NUMBER}_0" | Out-File -FilePath $env:GITHUB_ENV -Append
            echo "VERSION_DOT_FILENAME=3.25.${env:BUILD_NUMBER}.0" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: hardcorehdc/Ditto
          ref: master
          clean: true
          fetch-depth: 1

      - name: Verify checkout
        shell: pwsh
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "GitHub repository: $env:GITHUB_REPOSITORY"
          git status
          Get-ChildItem -Force
          if (!(Test-Path "CP_Main_10.sln")) {
            throw "CP_Main_10.sln not found after checkout"
          }
          
      - name: Diagnose repository files
        shell: pwsh
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Root files:"
          Get-ChildItem $env:GITHUB_WORKSPACE -Force |
            Format-Table Name, Mode
          Write-Host "Solution files:"
          Get-ChildItem $env:GITHUB_WORKSPACE -Filter "*.sln*" -Recurse |
            Select-Object -ExpandProperty FullName         
      
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore CP_Main_10.sln

      - name: Build Ditto x64
        run: msbuild CP_Main_10.sln /p:Configuration=Release /p:Platform=x64

      - name: Create portable ZIP
        run: .\DittoSetup\BuildPortableZIP.bat "DittoPortable" bit64

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Ditto-Portable-x64
          path: DittoSetup/output/DittoPortable*.zip
          if-no-files-found: error
          retention-days: 7
